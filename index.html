<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auto DM Manager</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#07111b;
  --card:#101b27;
  --card2:#16283a;
  --blue:#2496ed;
  --blue2:#1768aa;
  --green:#20c997;
  --red:#ff5d6c;
  --text:#fff;
  --muted:#8d9aaa;
  --border:rgba(255,255,255,.07);
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,rgba(36,150,237,.3),transparent 42%),
    linear-gradient(180deg,#07111b,#0b121a);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.page{
  max-width:620px;
  margin:auto;
  padding:20px 15px 35px;
}

.header{
  text-align:center;
  padding:10px 0 22px;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:23px;
  display:grid;
  place-items:center;
  font-size:32px;
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  box-shadow:0 15px 40px rgba(36,150,237,.25);
}

h1{
  margin:15px 0 5px;
  font-size:29px;
  font-weight:900;
}

.sub{
  color:var(--muted);
  font-size:14px;
}

.card{
  background:rgba(16,27,39,.97);
  border:1px solid var(--border);
  border-radius:24px;
  padding:19px;
  margin-bottom:16px;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}

.profile{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px;
  border-radius:18px;
  background:var(--card2);
  margin-bottom:18px;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,var(--blue),var(--blue2));
  font-size:22px;
  font-weight:900;
}

.name{
  font-size:17px;
  font-weight:800;
}

.id{
  margin-top:3px;
  color:var(--muted);
  font-size:13px;
}

.badge{
  margin-left:auto;
  padding:7px 10px;
  border-radius:20px;
  color:#bdf5dc;
  background:rgba(32,201,151,.12);
  font-size:11px;
  font-weight:800;
}

h2{
  margin:0 0 16px;
  font-size:20px;
}

label{
  display:block;
  color:#b8c3cf;
  font-size:13px;
  font-weight:700;
  margin:14px 0 7px;
}

input,textarea,select{
  width:100%;
  border:1px solid rgba(255,255,255,.08);
  outline:none;
  border-radius:14px;
  padding:14px;
  background:#0b1621;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:115px;
  resize:none;
}

input:focus,textarea:focus,select:focus{
  border-color:rgba(36,150,237,.65);
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:15px;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  font-size:15px;
  font-weight:900;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#172536;
}

.stop{
  background:rgba(255,93,108,.13);
  color:#ffb8c0;
}

.task{
  background:#0b1621;
  border:1px solid var(--border);
  border-radius:17px;
  padding:15px;
  margin-top:12px;
}

.task-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.task-title{
  font-weight:800;
}

.task-target{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.running{
  color:#8df0c8;
  font-size:12px;
  font-weight:800;
}

.stopped{
  color:#ff9aa5;
  font-size:12px;
  font-weight:800;
}

.task-msg{
  margin-top:12px;
  padding:10px;
  border-radius:11px;
  background:#111f2d;
  color:#b8c3cf;
  font-size:13px;
  white-space:pre-wrap;
}

.status{
  display:none;
  padding:13px;
  margin-top:14px;
  border-radius:14px;
  font-size:13px;
}

.success{
  display:block;
  color:#bdf5dc;
  background:rgba(32,201,151,.12);
}

.error{
  display:block;
  color:#ffd0d5;
  background:rgba(255,93,108,.12);
}

.empty{
  color:var(--muted);
  text-align:center;
  padding:25px 10px;
}

.footer{
  text-align:center;
  color:#68798b;
  font-size:12px;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <div class="logo">🤖</div>
    <h1>Auto DM Manager</h1>
    <div class="sub">Create and manage your messaging tasks</div>
  </div>

  <div class="card">

    <div class="profile">

      <div class="avatar" id="avatar">T</div>

      <div>
        <div class="name" id="userName">Telegram User</div>
        <div class="id" id="userId">Telegram ID: —</div>
      </div>

      <div class="badge">VERIFIED ✓</div>

    </div>

    <h2>➕ Create Auto DM Task</h2>

    <label>Target</label>

    <input
      id="target"
      type="text"
      placeholder="@username or target"
    >

    <label>Message</label>

    <textarea
      id="message"
      placeholder="Write your message..."
    ></textarea>

    <label>Delay between messages</label>

    <select id="delay">
      <option value="30">30 seconds</option>
      <option value="60">1 minute</option>
      <option value="120">2 minutes</option>
      <option value="300">5 minutes</option>
    </select>

    <button id="create">
      CREATE TASK
    </button>

    <div id="status" class="status"></div>

  </div>

  <div class="card">

    <h2>📋 My Tasks</h2>

    <div id="tasks">

      <div class="empty">
        No tasks created yet.
      </div>

    </div>

  </div>

  <div class="footer">
    Auto DM Manager • Telegram Mini App
  </div>

</div>

<script>

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

const user =
  tg &&
  tg.initDataUnsafe &&
  tg.initDataUnsafe.user
    ? tg.initDataUnsafe.user
    : null;

const tasks = [];

const userName =
  document.getElementById("userName");

const userId =
  document.getElementById("userId");

const avatar =
  document.getElementById("avatar");

if(tg){

  tg.ready();
  tg.expand();

  if(tg.setHeaderColor){
    tg.setHeaderColor("#07111b");
  }

  if(tg.setBackgroundColor){
    tg.setBackgroundColor("#07111b");
  }

}

if(user){

  const fullName =
    [user.first_name,user.last_name]
      .filter(Boolean)
      .join(" ") || "Telegram User";

  userName.textContent =
    fullName +
    (user.username
      ? "  @" + user.username
      : "");

  userId.textContent =
    "Telegram ID: " + user.id;

  avatar.textContent =
    (user.first_name || "T")
      .charAt(0)
      .toUpperCase();

}

function showStatus(text,type){

  const box =
    document.getElementById("status");

  box.className =
    "status " + type;

  box.textContent = text;

}

function renderTasks(){

  const box =
    document.getElementById("tasks");

  if(tasks.length === 0){

    box.innerHTML =
      '<div class="empty">No tasks created yet.</div>';

    return;

  }

  box.innerHTML = "";

  tasks.forEach((task,index)=>{

    const div =
      document.createElement("div");

    div.className = "task";

    div.innerHTML = `

      <div class="task-top">

        <div>

          <div class="task-title">
            Task #${index + 1}
          </div>

          <div class="task-target">
            ${escapeHtml(task.target)}
          </div>

        </div>

        <div class="${task.running ? "running" : "stopped"}">
          ${task.running ? "● RUNNING" : "● STOPPED"}
        </div>

      </div>

      <div class="task-msg">
        ${escapeHtml(task.message)}
      </div>

      <button
        class="${task.running ? "stop" : "secondary"}"
        onclick="toggleTask(${index})"
      >
        ${task.running ? "STOP TASK" : "START TASK"}
      </button>

      <button
        class="stop"
        onclick="deleteTask(${index})"
      >
        DELETE
      </button>

    `;

    box.appendChild(div);

  });

}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

document
  .getElementById("create")
  .addEventListener("click",()=>{

    const target =
      document
        .getElementById("target")
        .value
        .trim();

    const message =
      document
        .getElementById("message")
        .value
        .trim();

    const delay =
      Number(
        document
          .getElementById("delay")
          .value
      );

    if(!target){

      showStatus(
        "❌ Target enter karo.",
        "error"
      );

      return;

    }

    if(!message){

      showStatus(
        "❌ Message enter karo.",
        "error"
      );

      return;

    }

    tasks.push({

      target,
      message,
      delay,
      running:false

    });

    document
      .getElementById("target")
      .value = "";

    document
      .getElementById("message")
      .value = "";

    renderTasks();

    showStatus(
      "✅ Task created successfully.",
      "success"
    );

  });

window.toggleTask = function(index){

  tasks[index].running =
    !tasks[index].running;

  renderTasks();

};

window.deleteTask = function(index){

  tasks.splice(index,1);

  renderTasks();

  showStatus(
    "Task deleted.",
    "success"
  );

};

renderTasks();

</script>

</body>
</html>
